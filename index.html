<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loja Digital</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --black:#030706;
    --navy:#071426;
    --navy2:#0b1d35;
    --darkgreen:#06231d;
    --green:#00c98b;
    --green2:#009f70;
    --text:#f5f8f7;
    --muted:#a9b8b5;
    --border:rgba(0,201,139,.18);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 15% 15%,rgba(0,201,139,.15),transparent 28%),
        radial-gradient(circle at 85% 25%,rgba(15,55,100,.25),transparent 30%),
        linear-gradient(135deg,
        var(--black) 0%,
        var(--navy) 38%,
        var(--darkgreen) 72%,
        #03110e 100%);
    color:var(--text);
    min-height:100vh;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(3,7,6,.86);
    backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
}

.nav{
    max-width:1120px;
    margin:auto;
    padding:17px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:-.5px;
}

.logo:before{
    content:'$';
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:42px;
    height:42px;
    margin-right:10px;
    border-radius:13px;
    color:#03110d;
    background:linear-gradient(135deg,#00e09a,#00a874);
    font-size:22px;
    box-shadow:0 8px 25px rgba(0,201,139,.25);
}

.help{
    border:1px solid rgba(0,201,139,.35);
    background:rgba(0,201,139,.08);
    color:#55e8b5;
    padding:11px 18px;
    border-radius:999px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.help:hover{
    background:rgba(0,201,139,.16);
    transform:translateY(-2px);
}

/* HERO */

.hero{
    max-width:1120px;
    margin:auto;
    padding:75px 22px 55px;
    text-align:center;
    position:relative;
}

.hero:before{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    left:50%;
    top:30px;
    transform:translateX(-50%);
    background:rgba(0,201,139,.08);
    filter:blur(90px);
    border-radius:50%;
    z-index:-1;
}

.badge{
    display:inline-block;
    border:1px solid rgba(0,201,139,.28);
    background:rgba(0,201,139,.08);
    color:#51e8b6;
    padding:10px 20px;
    border-radius:999px;
    font-size:13px;
    font-weight:800;
    letter-spacing:.4px;
    margin-bottom:25px;
}

.hero h1{
    font-size:clamp(38px,6vw,66px);
    line-height:1.04;
    max-width:900px;
    margin:0 auto 24px;
    letter-spacing:-2px;
}

.hero h1 strong{
    background:linear-gradient(90deg,#00d99a,#53efbd);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    max-width:720px;
    margin:auto;
    color:var(--muted);
    font-size:19px;
    line-height:1.7;
}

/* PRODUTOS */

.grid{
    max-width:1120px;
    margin:10px auto 80px;
    padding:0 22px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:28px;
}

.card{
    background:
        linear-gradient(145deg,
        rgba(13,34,55,.96),
        rgba(4,28,24,.96));
    border:1px solid rgba(0,201,139,.18);
    border-radius:25px;
    overflow:hidden;
    box-shadow:
        0 20px 60px rgba(0,0,0,.30),
        inset 0 1px rgba(255,255,255,.03);
    transition:.25s ease;
}

.card:hover{
    transform:translateY(-8px);
    border-color:rgba(0,201,139,.42);
    box-shadow:
        0 28px 75px rgba(0,0,0,.40),
        0 0 30px rgba(0,201,139,.08);
}

.card img{
    width:100%;
    height:255px;
    object-fit:cover;
    background:#071426;
}

.content{
    padding:28px;
}

.content h3{
    font-size:27px;
    line-height:1.18;
    margin-bottom:13px;
}

.desc{
    color:#aabbb7;
    font-size:16px;
    line-height:1.7;
    min-height:82px;
}

.price{
    font-size:29px;
    font-weight:900;
    margin:20px 0;
    color:#ffffff;
}

.buy{
    width:100%;
    border:0;
    background:linear-gradient(135deg,#00d99a,#009f70);
    color:#02130e;
    padding:16px;
    border-radius:13px;
    font-weight:900;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 10px 28px rgba(0,201,139,.20);
    transition:.2s;
}

.buy:hover{
    transform:translateY(-3px);
    filter:brightness(1.08);
    box-shadow:0 15px 35px rgba(0,201,139,.30);
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
    z-index:20;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    background:
        linear-gradient(145deg,#0b1d35,#061b17);
    border:1px solid rgba(0,201,139,.22);
    border-radius:22px;
    max-width:540px;
    width:100%;
    padding:28px;
    max-height:90vh;
    overflow:auto;
    box-shadow:0 30px 90px rgba(0,0,0,.55);
}

.close{
    float:right;
    border:0;
    background:#142536;
    color:#fff;
    border-radius:50%;
    width:35px;
    height:35px;
    cursor:pointer;
    font-size:18px;
}

.box h2{
    margin-top:0;
    margin-bottom:10px;
}

.field{
    margin:13px 0;
}

.field label{
    display:block;
    font-size:14px;
    font-weight:800;
    margin-bottom:7px;
    color:#d9e6e3;
}

.field input,
.field textarea{
    width:100%;
    padding:13px;
    border:1px solid rgba(0,201,139,.20);
    border-radius:10px;
    background:#071426;
    color:#fff;
    outline:none;
}

.field input:focus,
.field textarea:focus{
    border-color:#00c98b;
    box-shadow:0 0 0 3px rgba(0,201,139,.08);
}

.pay{
    background:
        linear-gradient(135deg,
        rgba(0,201,139,.09),
        rgba(10,35,60,.65));
    border:1px solid rgba(0,201,139,.20);
    padding:16px;
    border-radius:13px;
    margin:16px 0;
    line-height:1.9;
    color:#d9e6e3;
}

.confirm{
    background:linear-gradient(135deg,#00c98b,#008f66);
    color:#02130e;
}

.small{
    font-size:12px;
    color:#8fa39e;
    margin-top:12px;
}

/* FOOTER */

footer{
    text-align:center;
    color:#7f9791;
    padding:45px 20px;
    border-top:1px solid rgba(0,201,139,.12);
    background:rgba(2,8,13,.55);
}

/* MOBILE */

@media(max-width:600px){

    .nav{
        padding:13px 16px;
    }

    .logo{
        font-size:19px;
    }

    .logo:before{
        width:37px;
        height:37px;
    }

    .hero{
        padding:52px 18px 40px;
    }

    .hero h1{
        font-size:37px;
        letter-spacing:-1.4px;
    }

    .hero p{
        font-size:17px;
    }

    .grid{
        padding:0 16px;
        margin-bottom:55px;
    }

    .card img{
        height:220px;
    }

    .content{
        padding:23px;
    }
}

</style>
</head>

<body>

<header>

<div class="nav">

<div class="logo" id="storeName">
LOJA DIGITAL
</div>

<button class="help" onclick="openHelp()">
Ajuda
</button>

</div>

</header>


<section class="hero">

<div class="badge">
GUIA PRÁTICO DE EDUCAÇÃO DIGITAL
</div>

<h1>
Conhecimento que pode fazer
<strong>diferença</strong>
no seu dia a dia.
</h1>

<p>
Conteúdo direto, acessível e pensado para aplicação prática.
Escolha o material que faz sentido para o seu objetivo.
</p>

</section>


<main class="grid" id="products"></main>


<footer>
© 2026 AMARO JACINTO · Conteúdo digital · Centro de ajuda
</footer>


<div class="modal" id="modal">

<div class="box">

<button class="close" onclick="closeModal()">
×
</button>

<div id="modalContent"></div>

</div>

</div>


<script>

const products=[

{
id:1,
name:"Como Fazer o Dinheiro Sobrar",
price:"5.000 Kz",
image:"https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=900&q=80",
desc:"Um guia prático para organizar melhor o dinheiro e transformar pequenos hábitos financeiros em resultados."
},

{
id:2,
name:"Renda Passiva com Inteligência Artificial",
price:"7.500 Kz",
image:"https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=900&q=80",
desc:"Conteúdo digital sobre possibilidades de utilização da inteligência artificial para criar novas fontes de rendimento."
}

];


const payments={

"IBAN":"0000 0000 0000 0000 0000 0",

"MULTICAIXA EXPRESS":"+244 900 000 000",

"PAYPAY":"000000000",

"RODTPAY":"Dados de pagamento"

};


const whatsapp="244900000000";


function render(){

document.getElementById("products").innerHTML=

products.map(p=>`

<article class="card">

<img
src="${p.image}"
alt="${p.name}"
>

<div class="content">

<h3>
${p.name}
</h3>

<div class="desc">
${p.desc}
</div>

<div class="price">
${p.price}
</div>

<button
class="buy"
onclick="buy(${p.id})"
>
Adquirir agora
</button>

</div>

</article>

`).join("");

}


function buy(id){

const p=products.find(x=>x.id===id);

document.getElementById("modalContent").innerHTML=`

<h2>
Comprar: ${p.name}
</h2>

<p>
<b>${p.price}</b>
</p>

<div class="field">

<label>
Nome
</label>

<input
id="name"
placeholder="Seu nome"
>

</div>


<div class="field">

<label>
WhatsApp
</label>

<input
id="phone"
placeholder="+244 ..."
>

</div>


<div class="field">

<label>
E-mail
</label>

<input
id="email"
type="email"
placeholder="seu@email.com"
>

</div>


<div class="pay">

<b>
Métodos de pagamento
</b>

<br><br>

${Object.entries(payments).map(([k,v])=>`

<b>${k}:</b> ${v}

<br>

`).join("")}

</div>


<div class="field">

<label>
Comprovativo
</label>

<input
id="proof"
type="file"
accept="image/*,.pdf"
>

</div>


<button
class="buy confirm"
onclick="sendProof(${id})"
>

Enviar comprovativo pelo WhatsApp

</button>


<p class="small">

Após a confirmação do pagamento,
o link de acesso será enviado para
o WhatsApp e/ou e-mail informado.

</p>

`;

document.getElementById("modal").style.display="flex";

}


function sendProof(id){

const p=products.find(x=>x.id===id);

const name=
document.getElementById("name").value;

const phone=
document.getElementById("phone").value;

const email=
document.getElementById("email").value;


if(!name||!phone||!email){

alert(
"Preencha nome, WhatsApp e e-mail."
);

return;

}


const text=

`Olá. Fiz uma compra na Loja Digital.

Produto: ${p.name}

Valor: ${p.price}

Cliente: ${name}

WhatsApp: ${phone}

E-mail: ${email}

Estou a enviar o comprovativo de pagamento.`;


window.open(
`https://wa.me/${whatsapp}?text=${encodeURIComponent(text)}`,
"_blank"
);

}


function openHelp(){

document.getElementById("modalContent").innerHTML=`

<h2>
Centro de ajuda
</h2>

<p>

<b>Como comprar?</b>

<br>

Escolha um produto,
preencha os seus dados,
faça o pagamento e envie
o comprovativo.

</p>

<br>

<p>

<b>Quando recebo o produto?</b>

<br>

Após a confirmação do pagamento,
o acesso será enviado pelo contacto
informado.

</p>

<br>

<p>

<b>Precisa de suporte?</b>

<br>

Use o WhatsApp da loja
para falar com o atendimento.

</p>

`;

document.getElementById("modal").style.display="flex";

}


function closeModal(){

document.getElementById("modal").style.display="none";

}


render();

</script>

</body>
</html>
